<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>goav WebRTC Runtime Ladder</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101214;
      --panel: #181c20;
      --panel-2: #20262b;
      --line: #333d44;
      --text: #eef3f4;
      --muted: #9aa8ad;
      --teal: #34d0b6;
      --amber: #e9b44c;
      --rose: #ff6b6b;
      --blue: #63a4ff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }
    button, input, select {
      font: inherit;
      color: inherit;
    }
    button {
      border: 1px solid var(--line);
      background: var(--panel-2);
      min-height: 36px;
      border-radius: 6px;
      padding: 0 12px;
      cursor: pointer;
    }
    button.primary {
      background: var(--teal);
      color: #061412;
      border-color: transparent;
      font-weight: 700;
    }
    button.primary:disabled {
      background: #22302f;
      color: #8aa29f;
      border-color: var(--line);
    }
    button.danger {
      background: #3b1f24;
      border-color: #613039;
      color: #ffd9df;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }
    input, select {
      width: 100%;
      border: 1px solid var(--line);
      background: #0d1012;
      border-radius: 6px;
      min-height: 34px;
      padding: 0 9px;
    }
    label {
      color: var(--muted);
      font-size: 12px;
      display: grid;
      gap: 5px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      background: #121619;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }
    main {
      display: grid;
      grid-template-columns: minmax(340px, 0.9fr) minmax(420px, 1.4fr);
      gap: 18px;
      padding: 18px;
    }
    section {
      min-width: 0;
    }
    .toolbar {
      display: flex;
      align-items: end;
      gap: 10px;
      flex-wrap: wrap;
    }
    .toolbar label {
      min-width: 150px;
    }
    .status {
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--amber);
    }
    .dot.live { background: var(--teal); }
    .dot.bad { background: var(--rose); }
    .stack {
      display: grid;
      gap: 14px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      min-width: 0;
    }
    .panel-head {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 12px;
      border-bottom: 1px solid var(--line);
    }
    .panel-head h2 {
      margin: 0;
      font-size: 14px;
      letter-spacing: 0;
    }
    .panel-body {
      padding: 12px;
    }
    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #050607;
      border-radius: 6px;
      object-fit: cover;
      display: block;
    }
    audio {
      width: 100%;
    }
    .remote-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }
    .tile {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      min-width: 0;
    }
    .tile-title {
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 10px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 7px;
      border-radius: 999px;
      background: #263139;
      color: #c8d5d9;
      font-size: 12px;
      white-space: nowrap;
    }
    .tile-body {
      padding: 10px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
      align-items: end;
    }
    .controls .wide { grid-column: span 2; }
    .runtime-list {
      display: grid;
      gap: 10px;
    }
    .runtime-row {
      display: grid;
      grid-template-columns: 92px 84px repeat(3, minmax(72px, 1fr)) 76px 76px;
      gap: 8px;
      align-items: end;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #14181b;
    }
    .metric {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .graphs {
      display: grid;
      gap: 12px;
    }
    svg {
      width: 100%;
      height: 310px;
      display: block;
      background: #0b0e10;
      border-radius: 6px;
    }
    .empty {
      color: var(--muted);
      min-height: 120px;
      display: grid;
      place-items: center;
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: 6px;
    }
    .log {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
    }
    @media (max-width: 940px) {
      main { grid-template-columns: 1fr; }
      header { align-items: stretch; flex-direction: column; }
      .runtime-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .controls .wide { grid-column: span 1; }
    }
  </style>
</head>
<body>
  <header>
    <h1>goav WebRTC Runtime Ladder</h1>
    <div class="toolbar">
      <label>Camera codec
        <select id="uploadCodec"></select>
      </label>
      <button id="start" class="primary">Start</button>
      <div class="status"><span id="dot" class="dot"></span><span id="status">idle</span></div>
    </div>
  </header>

  <main>
    <section class="stack">
      <div class="panel">
        <div class="panel-head"><h2>Camera</h2><span id="inboundCodec" class="badge">waiting</span></div>
        <div class="panel-body">
          <video id="local" autoplay muted playsinline></video>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Add Rendition</h2></div>
        <div class="panel-body">
          <div class="controls">
            <label>Kind
              <select id="newKind">
                <option value="video">video</option>
                <option value="audio">audio</option>
              </select>
            </label>
            <label>Codec
              <select id="newCodec"></select>
            </label>
            <label>Width
              <input id="newWidth" type="number" min="64" step="2" value="960">
            </label>
            <label>Height
              <input id="newHeight" type="number" min="64" step="2" value="540">
            </label>
            <label class="wide">Bitrate
              <input id="newBitrate" type="number" min="16000" step="10000" value="1200000">
            </label>
            <button id="add" class="primary" disabled>Add</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Runtime Controls</h2></div>
        <div id="runtimeList" class="panel-body runtime-list"></div>
      </div>
    </section>

    <section class="stack">
      <div class="panel">
        <div class="panel-head"><h2>Browser Outputs</h2><span id="remoteCount" class="badge">0 tracks</span></div>
        <div id="remotes" class="panel-body remote-grid"></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Live Graph</h2><span id="graphBadge" class="badge">0 nodes</span></div>
        <div class="panel-body graphs">
          <svg id="videoGraph" role="img" aria-label="video graph"></svg>
          <svg id="audioGraph" role="img" aria-label="audio graph"></svg>
          <div id="log" class="log"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const state = {
      pc: null,
      sessionID: "",
      poll: 0,
      remoteTracks: new Map(),
      last: null
    };

    const els = {
      start: document.querySelector("#start"),
      add: document.querySelector("#add"),
      uploadCodec: document.querySelector("#uploadCodec"),
      newKind: document.querySelector("#newKind"),
      newCodec: document.querySelector("#newCodec"),
      newWidth: document.querySelector("#newWidth"),
      newHeight: document.querySelector("#newHeight"),
      newBitrate: document.querySelector("#newBitrate"),
      local: document.querySelector("#local"),
      remotes: document.querySelector("#remotes"),
      runtimeList: document.querySelector("#runtimeList"),
      status: document.querySelector("#status"),
      dot: document.querySelector("#dot"),
      inboundCodec: document.querySelector("#inboundCodec"),
      remoteCount: document.querySelector("#remoteCount"),
      videoGraph: document.querySelector("#videoGraph"),
      audioGraph: document.querySelector("#audioGraph"),
      graphBadge: document.querySelector("#graphBadge"),
      log: document.querySelector("#log")
    };

    initCodecControls();
    els.start.addEventListener("click", start);
    els.add.addEventListener("click", addRendition);
    els.newKind.addEventListener("change", syncNewCodecOptions);

    function initCodecControls() {
      const caps = RTCRtpSender.getCapabilities?.("video")?.codecs || [];
      const names = [...new Set(caps.map(c => codecName(c.mimeType)).filter(c => ["vp8", "vp9", "av1"].includes(c)))];
      const upload = names.length ? names : ["vp8"];
      els.uploadCodec.innerHTML = upload.map(c => `<option value="${c}">${c}</option>`).join("");
      syncNewCodecOptions();
    }

    function syncNewCodecOptions() {
      if (els.newKind.value === "audio") {
        els.newCodec.innerHTML = `<option value="opus">opus</option>`;
        els.newWidth.disabled = true;
        els.newHeight.disabled = true;
        els.newBitrate.value = "64000";
      } else {
        els.newCodec.innerHTML = `<option value="vp8">vp8</option><option value="vp9">vp9</option>`;
        els.newWidth.disabled = false;
        els.newHeight.disabled = false;
        if (Number(els.newBitrate.value) < 100000) els.newBitrate.value = "1200000";
      }
    }

    async function start() {
      setStatus("starting", "warn");
      els.start.disabled = true;
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } },
        audio: true
      });
      els.local.srcObject = stream;

      const pc = new RTCPeerConnection({ iceServers: [] });
      state.pc = pc;
      pc.ontrack = onRemoteTrack;
      pc.onconnectionstatechange = () => {
        const status = pc.connectionState;
        setStatus(status, status === "connected" ? "live" : status === "failed" ? "bad" : "warn");
      };

      const videoTrack = stream.getVideoTracks()[0];
      const audioTrack = stream.getAudioTracks()[0];
      const videoTx = pc.addTransceiver(videoTrack, { direction: "sendonly" });
      preferCodec(videoTx, els.uploadCodec.value);
      if (audioTrack) {
        const audioTx = pc.addTransceiver(audioTrack, { direction: "sendonly" });
        preferCodec(audioTx, "opus");
      }
      for (let i = 0; i < 10; i++) pc.addTransceiver("video", { direction: "recvonly" });
      for (let i = 0; i < 2; i++) pc.addTransceiver("audio", { direction: "recvonly" });

      const answer = await negotiate("/api/offer");
      state.sessionID = answer.id;
      els.add.disabled = false;
      setStatus("negotiated", "warn");
      state.poll = window.setInterval(refresh, 900);
      await refresh();
    }

    async function negotiate(url) {
      const offer = await state.pc.createOffer();
      await state.pc.setLocalDescription(offer);
      await waitForIceGathering(state.pc);
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(state.pc.localDescription)
      });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || "signaling failed");
      await state.pc.setRemoteDescription({ type: payload.type, sdp: payload.sdp });
      return payload;
    }

    async function addRendition() {
      if (!state.sessionID) return;
      const spec = readNewSpec();
      const response = await fetch(`/api/sessions/${state.sessionID}/renditions`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(spec)
      });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || "add failed");
      if (payload.needsRenegotiate) {
        await negotiate(`/api/sessions/${state.sessionID}/offer`);
      }
      await refresh();
    }

    async function updateRendition(id) {
      const row = document.querySelector(`[data-row="${id}"]`);
      const spec = {
        id,
        kind: row.dataset.kind,
        codec: row.dataset.codec,
        width: Number(row.querySelector("[data-field=width]")?.value || 0),
        height: Number(row.querySelector("[data-field=height]")?.value || 0),
        bitrate: Number(row.querySelector("[data-field=bitrate]").value)
      };
      const response = await fetch(`/api/sessions/${state.sessionID}/renditions/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(spec)
      });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || "update failed");
      await refresh();
    }

    async function deleteRendition(id) {
      const response = await fetch(`/api/sessions/${state.sessionID}/renditions/${id}`, { method: "DELETE" });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || "delete failed");
      if (payload.needsRenegotiate) {
        await negotiate(`/api/sessions/${state.sessionID}/offer`);
      }
      document.querySelector(`[data-tile="${id}"]`)?.remove();
      await refresh();
    }

    async function refresh() {
      if (!state.sessionID) return;
      const response = await fetch(`/api/sessions/${state.sessionID}/state`);
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || "state failed");
      state.last = payload;
      renderState(payload);
    }

    function readNewSpec() {
      const kind = els.newKind.value;
      return {
        kind,
        codec: els.newCodec.value,
        width: kind === "video" ? Number(els.newWidth.value) : 0,
        height: kind === "video" ? Number(els.newHeight.value) : 0,
        bitrate: Number(els.newBitrate.value)
      };
    }

    function onRemoteTrack(event) {
      const track = event.track;
      const id = track.id;
      state.remoteTracks.set(id, track);
      let tile = document.querySelector(`[data-tile="${id}"]`);
      if (!tile) {
        tile = document.createElement("div");
        tile.className = "tile";
        tile.dataset.tile = id;
        tile.innerHTML = `
          <div class="tile-title"><span>${id}</span><span class="badge">${track.kind}</span></div>
          <div class="tile-body"></div>
        `;
        els.remotes.append(tile);
      }
      const body = tile.querySelector(".tile-body");
      const mediaEl = document.createElement(track.kind === "audio" ? "audio" : "video");
      mediaEl.autoplay = true;
      mediaEl.playsInline = true;
      mediaEl.controls = track.kind === "audio";
      mediaEl.muted = track.kind === "video";
      mediaEl.srcObject = new MediaStream([track]);
      body.replaceChildren(mediaEl);
      track.onended = () => {
        state.remoteTracks.delete(id);
        tile.remove();
        updateRemoteCount();
      };
      updateRemoteCount();
    }

    function renderState(payload) {
      els.inboundCodec.textContent = [payload.videoCodec, payload.audioCodec].filter(Boolean).join(" + ") || "waiting";
      renderRuntimeList(payload.renditions || []);
      renderGraph(els.videoGraph, payload.videoGraph, "video");
      renderGraph(els.audioGraph, payload.audioGraph, "audio");
      const nodes = (payload.videoGraph?.nodes?.length || 0) + (payload.audioGraph?.nodes?.length || 0);
      els.graphBadge.textContent = `${nodes} nodes`;
      els.log.textContent = payload.lastError || "";
      updateRemoteCount();
    }

    function renderRuntimeList(renditions) {
      if (!renditions.length) {
        els.runtimeList.innerHTML = `<div class="empty">No renditions</div>`;
        return;
      }
      els.runtimeList.innerHTML = "";
      for (const r of renditions) {
        const row = document.createElement("div");
        row.className = "runtime-row";
        row.dataset.row = r.id;
        row.dataset.kind = r.kind;
        row.dataset.codec = r.codec;
        const isVideo = r.kind === "video";
        row.innerHTML = `
          <div><span class="badge">${r.codec}</span><div class="metric">${r.id}</div></div>
          <div class="metric">${r.bound ? "attached" : "waiting"}<br>${r.packets} packets<br>${formatBytes(r.bytes)}</div>
          <label>Width<input data-field="width" type="number" min="64" step="2" value="${r.width || ""}" ${isVideo ? "" : "disabled"}></label>
          <label>Height<input data-field="height" type="number" min="64" step="2" value="${r.height || ""}" ${isVideo ? "" : "disabled"}></label>
          <label>Bitrate<input data-field="bitrate" type="number" min="16000" step="10000" value="${r.bitrate}"></label>
          <button data-action="apply">Apply</button>
          <button class="danger" data-action="remove">Remove</button>
        `;
        row.querySelector("[data-action=apply]").onclick = () => updateRendition(r.id).catch(showError);
        row.querySelector("[data-action=remove]").onclick = () => deleteRendition(r.id).catch(showError);
        els.runtimeList.append(row);
      }
    }

    function renderGraph(svg, graph, label) {
      const nodes = graph?.nodes || [];
      const edges = graph?.edges || [];
      svg.setAttribute("viewBox", "0 0 920 310");
      if (!nodes.length) {
        svg.innerHTML = `<text x="460" y="158" text-anchor="middle" fill="#66747a">${label} graph waiting</text>`;
        return;
      }
      const depth = new Map(nodes.map(n => [n.name, 0]));
      for (let pass = 0; pass < nodes.length; pass++) {
        for (const e of edges) {
          depth.set(e.to, Math.max(depth.get(e.to) || 0, (depth.get(e.from) || 0) + 1));
        }
      }
      const maxDepth = Math.max(...depth.values(), 1);
      const lanes = new Map();
      for (const node of nodes) {
        const d = depth.get(node.name) || 0;
        if (!lanes.has(d)) lanes.set(d, []);
        lanes.get(d).push(node);
      }
      const pos = new Map();
      for (const [d, lane] of lanes) {
        lane.sort((a, b) => a.name.localeCompare(b.name));
        lane.forEach((node, i) => {
          const x = 24 + d * (872 / maxDepth);
          const y = 24 + i * Math.min(68, 250 / Math.max(1, lane.length));
          pos.set(node.name, { x, y });
        });
      }
      const lines = edges.map(e => {
        const a = pos.get(e.from);
        const b = pos.get(e.to);
        if (!a || !b) return "";
        return `<path d="M ${a.x + 150} ${a.y + 19} C ${a.x + 190} ${a.y + 19}, ${b.x - 40} ${b.y + 19}, ${b.x} ${b.y + 19}" stroke="#3c4a52" fill="none" stroke-width="2"/>`;
      }).join("");
      const boxes = nodes.map(node => {
        const p = pos.get(node.name);
        const color = node.kind === "source" ? "#17443d" : node.kind === "sink" ? "#4a3820" : "#1d2c42";
        const title = escapeHTML(node.name);
        const detail = escapeHTML((node.detail || node.kind || "").slice(0, 34));
        return `<g>
          <rect x="${p.x}" y="${p.y}" width="150" height="42" rx="6" fill="${color}" stroke="#52606a"/>
          <text x="${p.x + 8}" y="${p.y + 17}" fill="#edf4f5" font-size="12">${title}</text>
          <text x="${p.x + 8}" y="${p.y + 33}" fill="#9fb0b7" font-size="10">${detail}</text>
        </g>`;
      }).join("");
      svg.innerHTML = lines + boxes;
    }

    function preferCodec(transceiver, codec) {
      const kind = codec === "opus" ? "audio" : "video";
      const caps = RTCRtpSender.getCapabilities(kind);
      if (!caps?.codecs?.length || !transceiver.setCodecPreferences) return;
      const preferred = caps.codecs.filter(c => codecName(c.mimeType) === codec);
      const rest = caps.codecs.filter(c => codecName(c.mimeType) !== codec);
      if (preferred.length) transceiver.setCodecPreferences([...preferred, ...rest]);
    }

    function waitForIceGathering(pc) {
      if (pc.iceGatheringState === "complete") return Promise.resolve();
      return new Promise(resolve => {
        const done = () => {
          if (pc.iceGatheringState === "complete") {
            pc.removeEventListener("icegatheringstatechange", done);
            resolve();
          }
        };
        pc.addEventListener("icegatheringstatechange", done);
        setTimeout(resolve, 1500);
      });
    }

    function codecName(mime) {
      return String(mime || "").split("/").pop().toLowerCase();
    }

    function formatBytes(bytes) {
      if (bytes > 1_000_000) return `${(bytes / 1_000_000).toFixed(1)} MB`;
      if (bytes > 1000) return `${(bytes / 1000).toFixed(1)} KB`;
      return `${bytes || 0} B`;
    }

    function updateRemoteCount() {
      els.remoteCount.textContent = `${state.remoteTracks.size} tracks`;
    }

    function setStatus(text, mode) {
      els.status.textContent = text;
      els.dot.className = `dot ${mode === "live" ? "live" : mode === "bad" ? "bad" : ""}`;
    }

    function showError(err) {
      console.error(err);
      els.log.textContent = err.message || String(err);
      setStatus("error", "bad");
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[ch]);
    }
  </script>
</body>
</html>
