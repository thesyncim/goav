name: ci

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - 'rtpav/v*'
      - 'webrtcav/v*'
      - 'playoutav/v*'
      - 'player/v*'
      - 'native/v*'
      - 'cmd/goav/v*'
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        # The gate builds with the Go SIMD experiment, like the thesyncim/*
        # codec backends. The scalar lane is what importers get without
        # GOEXPERIMENT=simd; the purego lane is the scalar fallback under it.
        include:
          - os: ubuntu-latest
            go: '1.27.x'
            full: true
            goexperiment: simd
          - os: ubuntu-latest
            go: stable
            full: false
            goexperiment: simd
          - os: macos-latest
            go: '1.27.x'
            full: false
            goexperiment: simd
            purego: true
          - os: ubuntu-latest
            go: '1.27.x'
            full: false
            goexperiment: ''
    runs-on: ${{ matrix.os }}
    env:
      GOEXPERIMENT: ${{ matrix.goexperiment }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          # Without check-latest a stale runner image can pin an older patch
          # release, and govulncheck then fails on already-fixed stdlib vulns.
          check-latest: true
          cache: true

      # The native module's OpenH264 tests run against Cisco's own binary,
      # pinned by hash (the build Cisco's patent license covers).
      - name: Install Cisco OpenH264
        if: matrix.full
        run: |
          curl -fsSL -o "$RUNNER_TEMP/openh264.so.bz2" http://ciscobinary.openh264.org/libopenh264-2.6.0-linux64.8.so.bz2
          echo "27ab53323c110b76214c1c72222f459d17febbcd1e252136cadc292b0308d75b  $RUNNER_TEMP/openh264.so.bz2" | sha256sum -c -
          bunzip2 -c "$RUNNER_TEMP/openh264.so.bz2" | sudo tee /usr/local/lib/libopenh264.so.8 >/dev/null

      - name: Changelog hygiene
        if: matrix.full && github.event_name == 'pull_request'
        run: |
          if jq -e 'any(.pull_request.labels[]?.name; . == "skip-changelog")' "$GITHUB_EVENT_PATH" >/dev/null; then
            echo "skip-changelog label present"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)
          if ! printf '%s\n' "$changed" | grep -Ev '^changelog\.d/README\.md$' | grep -Eqx 'CHANGELOG\.md|changelog\.d/.+\.md'; then
            echo "add a changelog.d/<slug>.md fragment (or edit CHANGELOG.md), or apply the skip-changelog label for internal-only changes"
            exit 1
          fi

      - name: Build (pure Go)
        run: CGO_ENABLED=0 go build ./...

      # The full job collects coverage in the same run instead of executing
      # the identical suite twice.
      - name: Test
        if: ${{ !matrix.full }}
        run: CGO_ENABLED=0 go test -count=1 ./...

      - name: Test purego fallback
        if: matrix.purego
        run: CGO_ENABLED=0 go test -count=1 -tags purego ./...

      - name: Test with coverage
        if: matrix.full
        run: CGO_ENABLED=0 go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        if: matrix.full
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.go }}
          path: coverage.out

      - name: Race
        if: matrix.full
        run: CGO_ENABLED=1 go test -race -count=1 ./...

      # goavdebug poisons released pooled payloads, so any holder that kept
      # bytes without a reference (Ref/Retain) fails a byte-exact test.
      - name: Use-after-release (goavdebug)
        if: matrix.full
        run: |
          CGO_ENABLED=0 go test -count=1 -tags goavdebug ./...
          for m in rtpav webrtcav playoutav player native; do (cd "$m" && CGO_ENABLED=0 go test -count=1 -tags goavdebug ./...) || exit 1; done

      # One iteration per benchmark: catches bench bit-rot (compile/run errors)
      # without asserting timing, which would flake on shared runners.
      - name: Bench smoke
        if: matrix.full
        run: |
          mkdir -p bench-results
          CGO_ENABLED=0 go test -run '^$' -bench . -benchmem -benchtime=1x ./... | tee bench-results/bench-smoke.txt

      - name: PGO profile freshness
        if: matrix.full
        run: scripts/bench/check-pgo.sh

      - name: Benchmark baseline ratchet
        if: matrix.full
        run: scripts/bench/baseline.sh check

      - name: Performance lab smoke
        if: matrix.full
        run: PERF_BENCHTIME=1x scripts/bench/perf-lab.sh

      - name: Benchmark comparison against PR base
        if: matrix.full && github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          BENCH_COMPARE_COUNT=3 BENCH_COMPARE_TIME=1x scripts/bench/ci-compare.sh FETCH_HEAD

      - name: Upload benchmark artifact
        if: matrix.full
        uses: actions/upload-artifact@v7
        with:
          name: bench-smoke-${{ matrix.os }}-${{ matrix.go }}
          path: |
            bench-results/bench-smoke.txt
            bench-results/perf-lab-*.txt
            bench-results/baseline/**/*.txt
            bench-results/latency/*.json
            bench-results/rss/*.json
            bench-results/soak/*.json
            bench-results/pressure/*.json
            bench-results/control/*.json
            bench-results/fanout/*.json
            bench-results/live-sync/*.json
            bench-results/container/*.json
            bench-results/manifest/*.json
            bench-results/pprof/**
            bench-results/bench-base.txt
            bench-results/bench-current.txt
            bench-results/benchstat-pr-vs-base.txt

      - name: Fuzz smoke
        if: matrix.full
        run: |
          CGO_ENABLED=0 go test ./container/matroska -run '^$' -fuzz=FuzzDemuxerMalformedInputs -fuzztime=10s
          CGO_ENABLED=0 go test ./container/webm -run '^$' -fuzz=FuzzDemuxerMalformedInputs -fuzztime=10s
          CGO_ENABLED=0 go test ./container/mp4 -run '^$' -fuzz=FuzzDemuxerMalformedInputs -fuzztime=10s
          CGO_ENABLED=0 go test ./container/mp4 -run '^$' -fuzz=FuzzMuxRoundTrip -fuzztime=10s
          CGO_ENABLED=0 go test ./ctlserver -run '^$' -fuzz=FuzzHandler -fuzztime=10s
          CGO_ENABLED=0 go test ./ctlserver -run '^$' -fuzz=FuzzConnection -fuzztime=10s
          (cd rtpav && CGO_ENABLED=0 go test . -run '^$' -fuzz=FuzzDepacketizers -fuzztime=10s)
          CGO_ENABLED=0 go test . -run '^$' -fuzz=FuzzRecipe -fuzztime=10s

      - name: Vet
        run: CGO_ENABLED=0 go vet ./...

      # H.264 decode is opt-in (patent-sensitive), so the tagged build gets its
      # own lane; without it the tagged adapter bit-rots unseen.
      - name: H.264 build tag (goav_goh264)
        if: matrix.full
        run: |
          CGO_ENABLED=0 go vet -tags goav_goh264 ./...
          CGO_ENABLED=0 go test -count=1 -tags goav_goh264 . ./adapters/goh264 ./bundle ./container/...

      - name: Package documentation smoke
        if: matrix.full
        run: |
          missing="$(go list -f '{{if not .Doc}}{{.ImportPath}}{{end}}' ./... | grep -Ev '/internal/|/adapters/|/container/|/adapterproof$' || true)"
          if [ -n "$missing" ]; then
            echo "public packages without package docs:"
            echo "$missing"
            exit 1
          fi

      - name: Staticcheck
        if: matrix.full
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...

      - name: Govulncheck
        if: matrix.full
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Gofmt
        run: test -z "$(gofmt -l .)"

      - name: goavtest expect module
        if: matrix.full
        working-directory: goavtest/expect
        run: |
          CGO_ENABLED=0 go build ./...
          CGO_ENABLED=0 go test -count=1 ./...
          CGO_ENABLED=0 go vet ./...
          staticcheck ./...
          govulncheck ./...

      # Transport modules stay outside the root module graph
      # (TestRootModuleDependencyPurity); each is gated like the root.
      - name: rtpav module
        if: matrix.full
        working-directory: rtpav
        run: |
          CGO_ENABLED=0 go build ./...
          CGO_ENABLED=0 go test -count=1 ./...
          CGO_ENABLED=1 go test -race -count=1 ./...
          CGO_ENABLED=0 go vet ./...
          staticcheck ./...
          govulncheck ./...

      - name: webrtcav module
        if: matrix.full
        working-directory: webrtcav
        run: |
          CGO_ENABLED=0 go build ./...
          CGO_ENABLED=0 go test -count=1 ./...
          CGO_ENABLED=1 go test -race -count=1 ./...
          CGO_ENABLED=0 go vet ./...
          staticcheck ./...
          govulncheck ./...

      - name: playoutav module
        if: matrix.full
        working-directory: playoutav
        run: |
          CGO_ENABLED=0 go build ./...
          CGO_ENABLED=0 go test -count=1 ./...
          CGO_ENABLED=1 go test -race -count=1 ./...
          CGO_ENABLED=0 go vet ./...
          staticcheck ./...
          govulncheck ./...

      - name: player module
        if: matrix.full
        working-directory: player
        run: |
          CGO_ENABLED=0 go build ./...
          CGO_ENABLED=0 go test -count=1 ./...
          CGO_ENABLED=1 go test -race -count=1 ./...
          CGO_ENABLED=0 go vet ./...
          staticcheck ./...
          govulncheck ./...

      # Native codecs bind libraries through purego, so the module stays pure
      # Go; GOAV_NATIVE_REQUIRE fails, instead of skipping, a backend that
      # does not load.
      - name: native module
        if: matrix.full
        working-directory: native
        env:
          GOAV_NATIVE_REQUIRE: openh264
        run: |
          CGO_ENABLED=0 go build ./...
          CGO_ENABLED=0 go test -count=1 ./...
          CGO_ENABLED=1 go test -race -count=1 ./...
          CGO_ENABLED=0 go test -run '^$' -bench . -benchtime=1x ./...
          CGO_ENABLED=0 go vet ./...
          staticcheck ./...
          govulncheck ./...

      # cmd/goav carries no replace directive, so `go install ...@version`
      # works; a temporary workspace builds it against this checkout instead
      # of its pinned root and player.
      - name: cmd/goav module
        if: matrix.full
        working-directory: cmd/goav
        run: |
          export GOWORK="$RUNNER_TEMP/goav.work"
          go work init "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/player" "$GITHUB_WORKSPACE/cmd/goav"
          CGO_ENABLED=0 go build ./...
          CGO_ENABLED=0 go build -tags goav_noplay ./...
          CGO_ENABLED=0 go test -count=1 ./...
          CGO_ENABLED=0 go test -count=1 -tags goav_noplay ./...
          CGO_ENABLED=1 go test -race -count=1 ./...
          CGO_ENABLED=0 go vet ./...
          staticcheck ./...
          govulncheck ./...

      # The player's per-OS matrix (docs/ADAPTERS.md#player): every target
      # builds without cgo.
      - name: Player cross-builds (CGO_ENABLED=0)
        if: matrix.full
        run: |
          export GOWORK="$RUNNER_TEMP/goav-cross.work"
          go work init "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/player" "$GITHUB_WORKSPACE/cmd/goav"
          for target in darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            echo "::group::$target"
            (cd player && CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go build ./...) || exit 1
            (cd cmd/goav && CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null .) || exit 1
            (cd native && GOWORK=off CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go vet ./...) || exit 1
            echo "::endgroup::"
          done

      - name: Examples modules
        if: matrix.full
        run: |
          for mod in examples/*/go.mod; do
            dir="$(dirname "$mod")"
            echo "::group::$dir"
            (cd "$dir" && CGO_ENABLED=0 go build ./... && CGO_ENABLED=0 go test -count=1 ./...)
            echo "::endgroup::"
          done

      - name: Release tag validation
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          case "${GITHUB_REF_NAME}" in
            v[0-9]*.[0-9]*.[0-9]*|rtpav/v[0-9]*.[0-9]*.[0-9]*|webrtcav/v[0-9]*.[0-9]*.[0-9]*|playoutav/v[0-9]*.[0-9]*.[0-9]*|player/v[0-9]*.[0-9]*.[0-9]*|native/v[0-9]*.[0-9]*.[0-9]*|cmd/goav/v[0-9]*.[0-9]*.[0-9]*)
              ;;
            *)
              echo "unexpected tag shape: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac
          git verify-tag "${GITHUB_REF_NAME}"
          test -s CHANGELOG.md

  # VideoToolbox and AudioToolbox exist only on macOS, so their conformance
  # suites run here, next to Homebrew's OpenH264. A runner without a hardware
  # video encoder registers VideoToolbox unavailable and its tests say so.
  native-macos:
    runs-on: macos-latest
    env:
      GOEXPERIMENT: simd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: Install OpenH264
        run: brew install openh264
      - name: native module
        working-directory: native
        env:
          GOAV_NATIVE_REQUIRE: audiotoolbox,openh264
        run: |
          CGO_ENABLED=0 go test -count=1 -v -run 'TestVideoToolbox|TestAudioToolbox' . | grep -E '^\s*--- (SKIP|FAIL)|cannot run|unavailable' || true
          CGO_ENABLED=0 go test -count=1 ./...
          CGO_ENABLED=1 go test -race -count=1 ./...
          CGO_ENABLED=0 go test -run '^$' -bench . -benchtime=1x ./...

  # A nested module must be installable by a consumer with no checkout: no
  # workspace, no replace. The importer lives outside the repo and fetches the
  # module at this exact commit, so an unresolvable root pin fails here.
  consumer-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Install each nested module from a clean directory
        env:
          GOWORK: 'off'
          GOPROXY: direct
          GONOSUMDB: github.com/thesyncim
          GOFLAGS: -mod=mod
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          for mod in rtpav webrtcav playoutav player native goavtest/expect; do
            dir="$(mktemp -d)"
            cd "$dir"
            go mod init x
            go get "github.com/thesyncim/goav/${mod}@${SHA}"
            printf 'package main\n\nimport _ "github.com/thesyncim/goav/%s"\n\nfunc main() {}\n' "$mod" > main.go
            go build ./...
            cd - >/dev/null
          done
          # The CLI is installed with go install at a version, which refuses a
          # module carrying replace directives: build it as a dependency and
          # check its go.mod. (go install @SHA itself also needs the module on
          # the default branch, for its deprecation lookup.)
          dir="$(mktemp -d)"
          cd "$dir"
          go mod init x
          go get "github.com/thesyncim/goav/cmd/goav@${SHA}"
          go build -o goav github.com/thesyncim/goav/cmd/goav
          ./goav elements | grep -q "play"
          gomod="$(go mod download -json "github.com/thesyncim/goav/cmd/goav@${SHA}" | sed -n 's/.*"GoMod": "\(.*\)".*/\1/p')"
          if grep -q '^replace' "$gomod"; then echo "cmd/goav/go.mod carries a replace directive; go install would refuse it" >&2; exit 1; fi
