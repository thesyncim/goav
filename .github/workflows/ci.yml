name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Commit messages are part of the project's surface: no tool/AI credits,
      # no internal runtime paths. Scans the recent history on every push.
      - name: Commit hygiene
        run: |
          if git log -50 --format='%H %s%n%b' | grep -iE 'claude|anthropic|co-authored-by'; then
            echo 'forbidden commit-message content found'; exit 1
          fi
          echo clean

      - name: Build (pure Go)
        run: CGO_ENABLED=0 go build ./...

      - name: Test
        run: CGO_ENABLED=0 go test -count=1 ./...

      - name: Race
        run: CGO_ENABLED=1 go test -race -count=1 . ./pipeline ./goavtest ./format

      # One iteration per benchmark: catches bench bit-rot (compile/run errors)
      # without asserting timing, which would flake on shared runners.
      - name: Bench smoke
        run: CGO_ENABLED=0 go test -run '^$' -bench . -benchtime=1x ./...

      - name: Vet
        run: CGO_ENABLED=0 go vet ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Gofmt
        run: test -z "$(gofmt -l .)"

      - name: Examples module
        working-directory: examples/webrtc-runtime-ladder
        run: |
          CGO_ENABLED=0 go build ./...
          CGO_ENABLED=0 go test -count=1 ./...
