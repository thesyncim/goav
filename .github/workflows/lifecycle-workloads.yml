name: lifecycle-workloads

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Duration of each WebRTC mutation soak
        default: 1h
        required: true
  schedule:
    - cron: '23 3 * * 0'

permissions:
  contents: read

jobs:
  workloads:
    runs-on: macos-latest
    timeout-minutes: 300
    env:
      GOEXPERIMENT: simd
      GOAV_WEBRTC_SOAK_DURATION: ${{ inputs.duration || '2h' }}
      GOAV_WORKLOAD_OUTPUT: ${{ github.workspace }}/bench-results/release-workloads
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true
      - run: brew install ffmpeg openh264
      - name: File ladder and real WebRTC mutation
        run: bash scripts/bench/workloads.sh
      - name: Timeout recovery under race detection
        run: go test -race -count=100 ./pipeline -run '^(TestRetirementRecoversAfterTimeout|TestDeferredCleanupRetainsErrors)$'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lifecycle-workload-evidence
          path: bench-results/release-workloads/
