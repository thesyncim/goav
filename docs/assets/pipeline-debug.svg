<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">goav runtime debugging pipeline</title>
  <desc id="desc">A media source flows through decode and encode stages, named taps expose attach points, runtime branches can be attached for preview and diagnostics, and the same task exposes snapshots, watches, graph rendering, and controls.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#d97706"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#dc2626"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .core { fill: #eff6ff; stroke: #2563eb; }
      .tap { fill: #ecfdf5; stroke: #059669; }
      .diag { fill: #fffbeb; stroke: #d97706; }
      .ctrl { fill: #fef2f2; stroke: #dc2626; }
      .muted { fill: #64748b; }
      .title { fill: #0f172a; font: 700 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #0f172a; font: 700 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #334155; font: 500 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .code { fill: #0f172a; font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .line-blue { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-blue); }
      .line-green { fill: none; stroke: #059669; stroke-width: 3; marker-end: url(#arrow-green); }
      .line-amber { fill: none; stroke: #d97706; stroke-width: 3; marker-end: url(#arrow-amber); stroke-dasharray: 7 6; }
      .line-red { fill: none; stroke: #dc2626; stroke-width: 3; marker-end: url(#arrow-red); stroke-dasharray: 8 5; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="720" rx="0"/>
  <text class="title" x="48" y="52">Runtime pipeline debugging</text>
  <text class="small" x="48" y="78">The recipe, live task, and control socket expose the same graph: explain before run, inspect while running, attach probes without rebuilding.</text>

  <rect class="panel" x="38" y="105" width="760" height="360" rx="8"/>
  <text class="label" x="62" y="135">media graph</text>
  <text class="small" x="62" y="157">blue = media flow, green = named attach point</text>

  <g>
    <rect class="core" x="70" y="210" width="125" height="70" rx="7"/>
    <text class="label" x="100" y="240">input</text>
    <text class="code" x="91" y="263">source</text>

    <rect class="core" x="250" y="210" width="125" height="70" rx="7"/>
    <text class="label" x="288" y="240">decode</text>
    <text class="code" x="278" y="263">frames</text>

    <rect class="tap" x="430" y="210" width="125" height="70" rx="7"/>
    <text class="label" x="475" y="240">tap</text>
    <text class="code" x="454" y="263">frames</text>

    <rect class="core" x="610" y="210" width="125" height="70" rx="7"/>
    <text class="label" x="654" y="240">encode</text>
    <text class="code" x="651" y="263">av1</text>

    <rect class="core" x="610" y="335" width="125" height="70" rx="7"/>
    <text class="label" x="650" y="365">filesink</text>
    <text class="code" x="647" y="388">archive</text>

    <rect class="diag" x="250" y="335" width="125" height="70" rx="7"/>
    <text class="label" x="287" y="365">preview</text>
    <text class="code" x="279" y="388">attach</text>

    <rect class="diag" x="430" y="335" width="125" height="70" rx="7"/>
    <text class="label" x="459" y="365">rms meter</text>
    <text class="code" x="456" y="388">FrameFunc</text>

    <path class="line-blue" d="M195 245 H250"/>
    <path class="line-blue" d="M375 245 H430"/>
    <path class="line-blue" d="M555 245 H610"/>
    <path class="line-blue" d="M672 280 V335"/>
    <path class="line-green" d="M492 280 C492 318 355 312 313 335"/>
    <path class="line-green" d="M492 280 V335"/>
  </g>

  <rect class="panel" x="835" y="105" width="305" height="360" rx="8"/>
  <text class="label" x="859" y="135">debug surfaces</text>
  <text class="small" x="859" y="157">read-only views plus targeted controls</text>

  <g>
    <rect class="diag" x="870" y="188" width="235" height="54" rx="7"/>
    <text class="label" x="898" y="215">Explain before open</text>
    <text class="code" x="905" y="234">job.Explain(ctx)</text>

    <rect class="diag" x="870" y="262" width="235" height="54" rx="7"/>
    <text class="label" x="912" y="289">Live state</text>
    <text class="code" x="905" y="308">task.Snapshot()</text>

    <rect class="diag" x="870" y="336" width="235" height="54" rx="7"/>
    <text class="label" x="908" y="363">Events and watch</text>
    <text class="code" x="904" y="382">task.Watch(...)</text>

    <rect class="ctrl" x="870" y="410" width="235" height="54" rx="7"/>
    <text class="label" x="910" y="437">Live controls</text>
    <text class="code" x="900" y="456">goav ctl control</text>
  </g>

  <path class="line-amber" d="M735 232 C790 205 820 205 870 211"/>
  <path class="line-amber" d="M735 248 C800 265 815 284 870 289"/>
  <path class="line-amber" d="M735 370 C800 372 815 364 870 364"/>
  <path class="line-red" d="M870 437 C800 437 745 330 675 280"/>

  <rect class="panel" x="38" y="505" width="1102" height="155" rx="8"/>
  <text class="label" x="62" y="540">operator workflow</text>
  <text class="small" x="62" y="562">Three commands cover the normal loop: see the task, add a branch, then control it.</text>

  <g>
    <rect class="core" x="62" y="582" width="330" height="64" rx="7"/>
    <text class="code" x="84" y="606">goav ctl graph</text>
    <text class="small" x="84" y="626">Render Mermaid, DOT, text, or SVG.</text>

    <rect class="diag" x="425" y="582" width="330" height="64" rx="7"/>
    <text class="code" x="447" y="606">goav ctl attach</text>
    <text class="small" x="447" y="626">Add preview, meter, thumbnail, or recording.</text>
    <text class="small" x="447" y="641">Branches attach at named taps.</text>

    <rect class="ctrl" x="788" y="582" width="330" height="64" rx="7"/>
    <text class="code" x="810" y="606">goav ctl control</text>
    <text class="small" x="810" y="626">Seek, keyframe, bitrate, or select.</text>
    <text class="small" x="810" y="641">Deliver app events without rebuilding.</text>
  </g>
</svg>
